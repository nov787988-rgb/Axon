
name: Build Axon APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Unzip Axon project
        run: |
          mkdir -p project
          unzip -q Axon-Android-With-Logo.zip -d project
          find project -maxdepth 3 -type f | head -60

      - name: Build debug APK
        shell: bash
        run: |
          set -e
          BUILD_FILE=$(find project -type f \( -name settings.gradle.kts -o -name settings.gradle \) -print -quit)

          if [ -z "$BUILD_FILE" ]; then
            echo "ERROR: Gradle settings file not found"
            exit 1
          fi

          cd "$(dirname "$BUILD_FILE")"

          if [ -f gradlew ]; then
            chmod +x gradlew
            ./gradlew --no-daemon assembleDebug
          else
            gradle --no-daemon assembleDebug
          fi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Axon-APK
          path: project/**/build/outputs/apk/debug/*.apk
          if-no-files-found: error
